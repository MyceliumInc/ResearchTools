[package]
name = "mycelium-tools"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.8", features = ["http"] }
worker-macros = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.36"
urlencoding = "2"
futures = "0.3"
once_cell = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
