name = "mycelium-tools"
main = "build/worker/shim.mjs"
compatibility_date = "2026-04-01"

[[routes]]
pattern = "tools.mycelium.markets"
custom_domain = true

# Optional telemetry sink. If TELEMETRY_URL is set, each /v1/* response is
# reported as a JSON POST to this URL: {tool, ms, status, error}.
# TELEMETRY_AUTH (optional) is sent as both `Authorization: Bearer <value>`
# and `apikey: <value>` headers (the latter is harmless for non-Supabase
# receivers).
# [vars]
# TELEMETRY_URL = "https://example.com/ingest"
# TELEMETRY_AUTH = "..."

[placement]
mode = "smart"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = true

[observability.traces]
enabled = false
