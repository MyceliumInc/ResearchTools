name = "mycelium-tools"
main = "build/worker/shim.mjs"
compatibility_date = "2026-04-01"

[build]
command = "PATH=\"/opt/homebrew/opt/rustup/bin:$HOME/.cargo/bin:$PATH\" worker-build --release"

[[routes]]
pattern = "tools.mycelium.markets"
custom_domain = true

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
